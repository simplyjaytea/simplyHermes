name: simplyHermes
options:
  bundleIdPrefix: com.simplyjaytea
  deploymentTarget:
    iOS: "27.1"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  simplyHermes:
    path: .
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.17.0
targets:
  simplyHermes:
    type: application
    platform: iOS
    sources: [App/HermesApp, App/Shared]
    dependencies:
      - package: simplyHermes
        product: HermesKit
      - package: simplyHermes
        product: HermesSSH
      - package: simplyHermes
        product: HermesUI
      - target: simplyHermesWidgets
    entitlements:
      path: App/HermesApp/simplyHermes.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.simplyjaytea.simplyhermes
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.simplyjaytea.simplyhermes.shared
    info:
      path: App/HermesApp/Info.plist
      properties:
        CFBundleDisplayName: simplyHermes
        UILaunchScreen: {}
        # Lets SwiftUI animations run at 120 Hz on ProMotion screens.
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        NSLocalNetworkUsageDescription: simplyHermes connects to a Hermes server on your local network.
        NSCameraUsageDescription: simplyHermes scans server QR codes to add a connection.
        NSFaceIDUsageDescription: simplyHermes asks for Face ID before it uses your saved server keys.
        NSMicrophoneUsageDescription: simplyHermes listens to your voice for dictation and voice conversations.
        # Plan Q14: plain HTTP is allowed for local, private and Tailscale hosts (100.x and *.ts.net, which
        # NSAllowsLocalNetworking does not cover). The app refuses http:// to public hosts itself (ConnectionAddress).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        # Live Activity for running bot turns (WP-63/64).
        NSSupportsLiveActivities: true
        # "Keep bots live" holds a silent audio session while bots work (plans/ios-integration.md, D1).
        UIBackgroundModes: [audio]
        # simplyhermes://chat/<id>, opened by widgets and the Live Activity.
        CFBundleURLTypes:
          - CFBundleURLName: com.simplyjaytea.simplyhermes
            CFBundleURLSchemes: [simplyhermes]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplyjaytea.simplyhermes
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # The only extension besides the planned Share extension: free signing allows few App IDs.
  simplyHermesWidgets:
    type: app-extension
    platform: iOS
    sources: [App/HermesWidgets, App/Shared]
    dependencies:
      - package: simplyHermes
        product: HermesKit
      - package: simplyHermes
        product: HermesUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: App/HermesWidgets/simplyHermesWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.simplyjaytea.simplyhermes
    info:
      path: App/HermesWidgets/Info.plist
      properties:
        CFBundleDisplayName: simplyHermes
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplyjaytea.simplyhermes.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  simplyHermesTests:
    type: bundle.unit-test
    platform: iOS
    sources: [App/HermesAppTests]
    dependencies:
      - target: simplyHermes
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplyjaytea.simplyhermes.tests
        GENERATE_INFOPLIST_FILE: YES
  simplyHermesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [App/HermesAppUITests]
    dependencies:
      - target: simplyHermes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplyjaytea.simplyhermes.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  simplyHermes:
    build:
      targets:
        simplyHermes: all
    test:
      targets:
        - simplyHermesTests
        - simplyHermesUITests
