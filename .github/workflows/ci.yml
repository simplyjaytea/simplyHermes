name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Packages (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Format lint
        run: swift format lint --strict -r Sources Tests App
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  macos:
    name: App (Xcode 27, simulator)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
      - name: Install tools
        run: brew install xcodegen swiftlint xcbeautify
      - name: Lint
        run: swiftlint --strict
      - name: Generate project
        run: xcodegen generate
      - name: Pick simulator
        id: sim
        run: |
          set -euo pipefail
          # Prefer an iPhone Duo simulator; else the newest iPhone on the newest iOS runtime.
          xcrun simctl list devices available
          xcrun simctl list devices available -j > devices.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          d = json.load(open("devices.json"))["devices"]
          best = None
          for rt, devs in d.items():
              m = re.search(r"iOS-(\d+)-(\d+)", rt)
              if not m:
                  continue
              ver = (int(m.group(1)), int(m.group(2)))
              for dev in devs:
                  name = dev["name"]
                  if "iPhone" not in name:
                      continue
                  score = (1 if "Duo" in name else 0, ver, name)
                  if best is None or score > best[0]:
                      best = (score, dev["udid"], name, rt)
          print(f"udid={best[1]}")
          print(f"name={best[2]}")
          PY
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project simplyHermes.xcodeproj \
            -scheme simplyHermes \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/test.xcresult \
            CODE_SIGNING_ALLOWED=NO | xcbeautify
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: build/test.xcresult
