name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review starts the App job when a draft becomes the merge candidate. labeled lets `ci:app` run it on a
    # draft. Any other label does nothing.
    types: [opened, synchronize, reopened, ready_for_review, labeled]

# A label other than ci:app gets its own group, so it can't cancel the PR's running CI.
concurrency:
  group: >-
    ci-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'ci:app'
    && format('-ignored-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed files
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'ci:app' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether the App job runs
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # code=false only when a PR changes nothing but root README.md, CLAUDE.md and CONTRIBUTING.md,
          # or files under docs/ other than docs/protocol/ (tests read it). Pushes and empty diffs keep code=true.
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
            if [ -n "$changed" ] \
              && ! grep -qvE '^(README|CLAUDE|CONTRIBUTING)\.md$|^docs/' <<< "$changed" \
              && ! grep -qE '^docs/protocol/' <<< "$changed"; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  linux:
    name: Packages (Linux)
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'ci:app' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: System SQLite for GRDB, and Python for the CI scripts
        # The swift image has no python3; tools/ci/check_assistant_rows.py needs it.
        run: apt-get update && apt-get install -y libsqlite3-dev python3
      - name: Format lint
        run: swift format lint --strict -r Sources Tests App
      - name: Assistant rows come only from model output (AT-4a source lint)
        run: python3 -I tools/ci/check_assistant_rows.py
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  testbed:
    name: Testbed smoke (Docker)
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'ci:app' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Start testbed (with the Dex OIDC dashboard for WP-13)
        run: testbed/scripts/up.sh --profile oidc
      - name: Smoke test
        run: |
          python3 -m venv .venv
          .venv/bin/pip install websockets
          .venv/bin/python testbed/smoke_test.py
      - name: Record REST answers for list shapes (WP-53/54/55)
        run: python3 testbed/tools/record_rest.py --base http://127.0.0.1:9119 --out build/rest-fixtures
      - name: SSH transport integration (WP-14)
        run: |
          docker run --rm --network host -v "$PWD:/src" -w /src \
            -e HERMES_SSH_TEST_KEY=/src/testbed/data/ssh/id_ed25519 \
            swift:6.1 bash -c 'apt-get update -qq && apt-get install -y -qq libsqlite3-dev && swift test --filter SSHTunnelIntegrationTests'
      - name: REST, gateway, connection test and sign-in against the testbed (WP-11, WP-12, WP-22, WP-13)
        run: |
          docker run --rm --network host -v "$PWD:/src" -w /src \
            -e HERMES_TESTBED_URL=http://127.0.0.1:9119 \
            -e HERMES_TESTBED_OIDC_URL=http://127.0.0.1:9120 \
            swift:6.1 bash -c 'apt-get update -qq && apt-get install -y -qq libsqlite3-dev && swift test --filter "RESTLiveTests|GatewayLiveTests|GatewayConnectionTesterLiveTests|NativeAuthLiveTests|OIDCSignInLiveTests|ConnectionManagerLiveTests|ProfileTransferLiveTests|TerminalLiveTests"'
      - name: Upload REST answers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rest-fixtures
          path: build/rest-fixtures
          if-no-files-found: warn
      - name: Logs on failure
        if: failure()
        run: docker compose -f testbed/docker-compose.yml logs --tail=200
      - name: Stop
        if: always()
        run: testbed/scripts/down.sh

  macos:
    name: App (Xcode 27, simulator)
    needs: changes
    # One macOS runner, so only the merge candidate uses it: pushes to main, non-draft PRs, or a draft labelled
    # ci:app (one run; the label is removed at the end). Also skipped when the changes job sets code=false. If that job
    # fails, this job still runs. The merge gate (tools/ci/merge_gate.sh) treats a skipped App job as a failure.
    if: >-
      ${{ !cancelled() && needs.changes.outputs.code != 'false'
      && (github.event.action != 'labeled' || github.event.label.name == 'ci:app')
      && (github.event_name == 'push' || !github.event.pull_request.draft
      || contains(github.event.pull_request.labels.*.name, 'ci:app')) }}
    runs-on: xcode-27
    # Passing runs took 62-84 min (runs 41360146274, 41351410493). This stops a hung simulator from holding the only
    # macOS runner for the 6 h default.
    timeout-minutes: 110
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
      - name: Metal toolchain for MLX (best effort)
        continue-on-error: true
        run: |
          # mlx-swift compiles .metal sources during the build (WP-65c) and the hosted image may ship without the
          # toolchain. -showComponent exits 0 and prints "Status: uninstalled" when it is missing, so read Status.
          component_status() {
            xcodebuild -showComponent MetalToolchain 2>&1 | awk -F': *' '/^Status:/ { print tolower($2); exit }'
          }
          if [ "$(component_status)" = "installed" ]; then
            echo "MetalToolchain installed."
          else
            echo "MetalToolchain reports '$(component_status)'; downloading."
            xcodebuild -downloadComponent MetalToolchain
            echo "MetalToolchain now reports '$(component_status)'."
          fi
      - name: Install tools
        run: brew install xcodegen swiftlint xcbeautify
      - name: Lint
        run: swiftlint --strict
      - name: Generate project
        run: xcodegen generate
      - name: Get iOS 27.1 simulator runtime
        # The hosted runner sometimes has no iOS 27 runtime, and then every simulator step fails with a
        # runtime error. Retry the download, check that a runtime is installed, and fail here instead.
        run: |
          runtimes="$RUNNER_TEMP/runtimes.txt"
          for attempt in 1 2 3; do
            xcodebuild -downloadPlatform iOS -buildVersion 27.1 || xcodebuild -downloadPlatform iOS || true
            xcrun simctl list runtimes > "$runtimes"
            if grep -q "iOS 27" "$runtimes"; then
              exit 0
            fi
            echo "Attempt $attempt: no iOS 27 simulator runtime yet."
            sleep 30
          done
          echo "::error::No iOS 27 simulator runtime after 3 attempts."
          exit 1
      - name: Get Metal toolchain (SwiftTerm shaders)
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Pick simulator
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep -iE "duo|iphone" || true
          # Create an iPhone Duo device on the newest iOS runtime if the device type exists. A runner can keep a device
          # from an earlier job whose runtime has since gone, so delete that one first and make a fresh device.
          rt=$(xcrun simctl list runtimes -j | python3 -c "import sys,json;r=[x for x in json.load(sys.stdin)['runtimes'] if x.get('isAvailable') and x['identifier'].split('.')[-1].startswith('iOS-')];r.sort(key=lambda x:[int(n) for n in x['version'].split('.')]);print(r[-1]['identifier'])")
          duo=$(xcrun simctl list devicetypes -j | python3 -c "import sys,json;d=[x['identifier'] for x in json.load(sys.stdin)['devicetypes'] if 'duo' in x['name'].lower()];print(d[0] if d else '')")
          if [ -n "$duo" ]; then
            duo_id=$(xcrun simctl list devices -j | python3 -c "import sys,json;d=json.load(sys.stdin)['devices'];print(next((x['udid'] for devs in d.values() for x in devs if x['name']=='iPhone Duo CI'), ''))")
            if [ -n "$duo_id" ]; then
              xcrun simctl shutdown "$duo_id" 2>/dev/null || true
              xcrun simctl delete "$duo_id" 2>/dev/null || true
            fi
            xcrun simctl create "iPhone Duo CI" "$duo" "$rt" || true
          fi
          xcrun simctl list devices available -j > devices.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          d = json.load(open("devices.json"))["devices"]
          best = None
          for rt, devs in d.items():
              m = re.search(r"iOS-(\d+)-(\d+)", rt)
              if not m:
                  continue
              ver = (int(m.group(1)), int(m.group(2)))
              for dev in devs:
                  name = dev["name"]
                  if "iPhone" not in name:
                      continue
                  score = (1 if "Duo" in name else 0, ver, name)
                  if best is None or score > best[0]:
                      best = (score, dev["udid"], name, ver)
          print(f"udid={best[1]}")
          print(f"name={best[2]}")
          print(f"os={best[3][0]}.{best[3][1]}")
          PY
      - name: Start testbed dashboard for the connection UI test (WP-22)
        run: |
          set -euo pipefail
          brew install uv
          ref=$(sed -n 's/^ARG HERMES_REF=//p' testbed/hermes/Dockerfile)
          src="$RUNNER_TEMP/hermes"
          git init -q "$src"
          git -C "$src" remote add origin https://github.com/NousResearch/hermes-agent
          git -C "$src" fetch -q --depth 1 origin "$ref"
          git -C "$src" checkout -q FETCH_HEAD
          (cd "$src" && (uv sync --frozen --no-dev || uv sync --frozen))
          export HERMES_HOME="$RUNNER_TEMP/hermes-home"
          FAKE_LLM_URL=http://127.0.0.1:8700/v1 sh testbed/hermes/seed-config.sh "$HERMES_HOME"
          # Same login as testbed/docker-compose.yml; binding 0.0.0.0 turns the auth gate on.
          HERMES_DASHBOARD_BASIC_AUTH_USERNAME=tester \
          HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=testbed-password \
          HERMES_DASHBOARD_BASIC_AUTH_SECRET=testbed-stable-secret-0123456789abcdef \
            nohup "$src/.venv/bin/hermes" serve --host 0.0.0.0 --port 9119 > "$RUNNER_TEMP/hermes-serve.log" 2>&1 &
          for _ in $(seq 1 90); do
            curl -fsS http://127.0.0.1:9119/api/status > /dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:9119/api/health
      - name: Boot simulator for the test runner
        run: |
          udid="${{ steps.sim.outputs.udid }}"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
      - name: Boot simulator
        # The hosted iOS 27.1 runtime sometimes cannot boot a device, and xcodebuild then fails the Test step with no
        # test run (runs 41365833433, 41385043820). Boot it here, erase and retry, and name the failure if it persists.
        run: |
          udid="${{ steps.sim.outputs.udid }}"
          for attempt in 1 2 3; do
            xcrun simctl boot "$udid" 2>/dev/null || true
            if xcrun simctl bootstatus "$udid" -b; then
              exit 0
            fi
            echo "Attempt $attempt: simulator $udid did not boot. Erasing it and trying again."
            xcrun simctl shutdown "$udid" 2>/dev/null || true
            xcrun simctl erase "$udid" 2>/dev/null || true
            sleep 15
          done
          echo "::error::Simulator $udid did not boot after 3 attempts. This is the runner, not the app."
          exit 1
      - name: Test
        env:
          # xcodebuild passes TEST_RUNNER_* variables to the UI test runner without the prefix.
          TEST_RUNNER_HERMES_TESTBED_URL: http://127.0.0.1:9119
        run: |
          set -o pipefail
          echo "Simulator: ${{ steps.sim.outputs.name }} (iOS ${{ steps.sim.outputs.os }})"
          xcodebuild test \
            -skipPackagePluginValidation \
            -project simplyHermes.xcodeproj \
            -scheme simplyHermes \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/test.xcresult \
            -retry-tests-on-failure -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO | xcbeautify
      - name: Screenshot app on simulator
        if: always()
        run: |
          set -eo pipefail
          mkdir -p build/shots
          udid="${{ steps.sim.outputs.udid }}"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcodebuild build \
            -skipPackagePluginValidation \
            -project simplyHermes.xcodeproj \
            -scheme simplyHermes \
            -destination "id=$udid" \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO | xcbeautify
          app=$(find build/dd/Build/Products -name "*.app" -maxdepth 3 | head -1)
          xcrun simctl install "$udid" "$app"
          bundle=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Info.plist")
          xcrun simctl launch "$udid" "$bundle"
          sleep 5
          # The Duo simulator has two displays, and simctl exits 22 unless one is named.
          xcrun simctl io "$udid" screenshot --display=1 build/shots/launch.png
          # WP-02: the posture debug view, as the Duo simulator (or the newest iPhone) reports it.
          xcrun simctl terminate "$udid" "$bundle" || true
          xcrun simctl launch "$udid" "$bundle" -HermesScreen postureDebug -HermesOnboarding skip
          sleep 4
          xcrun simctl io "$udid" screenshot --display=1 build/shots/posture-debug.png
          # App update banner with a stub feed (debug-only launch arguments). Best effort.
          xcrun simctl terminate "$udid" "$bundle" || true
          feed='{"version":"9.0.0-alpha.99","build":99,"installURL":"https://www.signulous.com/dashboard","notes":"Stub build for the screenshot"}'
          hex=$(printf '%s' "$feed" | xxd -p | tr -d '\n')
          xcrun simctl launch "$udid" "$bundle" -HermesOnboarding skip -HermesLayout compact \
            -HermesAppUpdateReset YES -HermesAppUpdateStubOpen YES -HermesAppUpdateFeedHex "$hex" || true
          sleep 5
          xcrun simctl io "$udid" screenshot --display=1 build/shots/app-update-banner.png || true
          # Live Activity (WP-63/64): run a long demo turn, then switch to Safari so the
          # Dynamic Island shows the activity. Best effort: older simulators have no island.
          xcrun simctl terminate "$udid" "$bundle" || true
          xcrun simctl launch "$udid" "$bundle" -HermesDemo liveActivity -HermesOnboarding skip || true
          sleep 6
          xcrun simctl io "$udid" screenshot --display=1 build/shots/live-in-app.png || true
          xcrun simctl openurl "$udid" "https://example.com" || true
          sleep 5
          xcrun simctl io "$udid" screenshot --display=1 build/shots/live-island.png || true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/shots
          if-no-files-found: warn
      - name: Build unsigned .ipa for sideloading
        run: |
          set -eo pipefail
          xcodebuild build \
            -skipPackagePluginValidation \
            -project simplyHermes.xcodeproj \
            -scheme simplyHermes \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/ddi \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | xcbeautify
          app=$(find build/ddi/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
          mkdir -p build/ipa/Payload
          cp -R "$app" build/ipa/Payload/
          (cd build/ipa && zip -qr simplyHermes-unsigned.ipa Payload && rm -rf Payload)
          ls -l build/ipa
      - name: No sample conversation text in the Release app (AT-4a)
        # Every assistant message must come from Hermes or the on-device model. The sample chats, their fake replies
        # and the fake approval are DEBUG-only; this fails if any of their text reaches the Release build.
        run: |
          set -eo pipefail
          app=$(find build/ddi/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
          found=0
          for text in "Backup cron fix" "Blog post draft" "Router firmware" "ssh-copy-id backup@nas.local" \
            "The NAS rejected the SSH key" "Checked the logs and the config"; do
            if grep -r -a -l -F -- "$text" "$app"; then
              echo "::error::Release app contains sample text: $text"
              found=1
            fi
          done
          # The demo stream and the sample data must not be compiled into Release (AT-4a). Read the symbol table, and
          # first prove it is readable, so a stripped binary cannot pass this check without looking.
          exe="$app/$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Info.plist")"
          xcrun nm "$exe" | xcrun swift-demangle > "$RUNNER_TEMP/release-symbols.txt"
          if ! grep -q -F "HermesKit.ChatSessionController" "$RUNNER_TEMP/release-symbols.txt"; then
            echo "::error::Release symbols are unreadable (stripped?), so AT-4a cannot check them."
            exit 1
          fi
          for symbol in "startDemoStream(" "appendWord(" "sampleTranscript(" "sampleSessions"; do
            if grep -F -m 3 -- "$symbol" "$RUNNER_TEMP/release-symbols.txt"; then
              echo "::error::Release app contains the DEBUG-only symbol $symbol"
              found=1
            fi
          done
          exit $found
      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: simplyHermes-unsigned-ipa
          path: build/ipa/simplyHermes-unsigned.ipa
      - name: Testbed dashboard log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/hermes-serve.log" || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: build/test.xcresult
      - name: ci:app is for one run
        # A draft keeps its labels, so without this every later push would take the macOS runner again.
        if: >-
          ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.draft
          && contains(github.event.pull_request.labels.*.name, 'ci:app') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label ci:app
