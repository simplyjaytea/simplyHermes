name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether the App job runs
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # code=false only when a PR changes nothing but root README.md, CLAUDE.md and CONTRIBUTING.md,
          # or files under docs/ other than docs/protocol/ (tests read it). Pushes and empty diffs keep code=true.
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
            if [ -n "$changed" ] \
              && ! grep -qvE '^(README|CLAUDE|CONTRIBUTING)\.md$|^docs/' <<< "$changed" \
              && ! grep -qE '^docs/protocol/' <<< "$changed"; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  linux:
    name: Packages (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: System SQLite for GRDB
        run: apt-get update && apt-get install -y libsqlite3-dev
      - name: Format lint
        run: swift format lint --strict -r Sources Tests App
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  testbed:
    name: Testbed smoke (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Start testbed (with the Dex OIDC dashboard for WP-13)
        run: testbed/scripts/up.sh --profile oidc
      - name: Smoke test
        run: |
          python3 -m venv .venv
          .venv/bin/pip install websockets
          .venv/bin/python testbed/smoke_test.py
      - name: Record REST answers for list shapes (WP-53/54/55)
        run: python3 testbed/tools/record_rest.py --base http://127.0.0.1:9119 --out build/rest-fixtures
      - name: SSH transport integration (WP-14)
        run: |
          docker run --rm --network host -v "$PWD:/src" -w /src \
            -e HERMES_SSH_TEST_KEY=/src/testbed/data/ssh/id_ed25519 \
            swift:6.1 bash -c 'apt-get update -qq && apt-get install -y -qq libsqlite3-dev && swift test --filter SSHTunnelIntegrationTests'
      - name: REST, gateway, connection test and sign-in against the testbed (WP-11, WP-12, WP-22, WP-13)
        run: |
          docker run --rm --network host -v "$PWD:/src" -w /src \
            -e HERMES_TESTBED_URL=http://127.0.0.1:9119 \
            -e HERMES_TESTBED_OIDC_URL=http://127.0.0.1:9120 \
            swift:6.1 bash -c 'apt-get update -qq && apt-get install -y -qq libsqlite3-dev && swift test --filter "RESTLiveTests|GatewayLiveTests|GatewayConnectionTesterLiveTests|NativeAuthLiveTests|OIDCSignInLiveTests|ConnectionManagerLiveTests|ProfileTransferLiveTests|TerminalLiveTests"'
      - name: Upload REST answers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rest-fixtures
          path: build/rest-fixtures
          if-no-files-found: warn
      - name: Logs on failure
        if: failure()
        run: docker compose -f testbed/docker-compose.yml logs --tail=200
      - name: Stop
        if: always()
        run: testbed/scripts/down.sh

  macos:
    name: App (Xcode 27, simulator)
    needs: changes
    # Skipped only when the changes job sets code=false. If that job fails, this job still runs.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
      - name: Metal toolchain for MLX (best effort)
        continue-on-error: true
        run: |
          # mlx-swift compiles .metal sources during the build (WP-65c) and the hosted image may ship without the
          # toolchain. -showComponent exits 0 and prints "Status: uninstalled" when it is missing, so read Status.
          component_status() {
            xcodebuild -showComponent MetalToolchain 2>&1 | awk -F': *' '/^Status:/ { print tolower($2); exit }'
          }
          if [ "$(component_status)" = "installed" ]; then
            echo "MetalToolchain installed."
          else
            echo "MetalToolchain reports '$(component_status)'; downloading."
            xcodebuild -downloadComponent MetalToolchain
            echo "MetalToolchain now reports '$(component_status)'."
          fi
      - name: Install tools
        run: brew install xcodegen swiftlint xcbeautify
      - name: Lint
        run: swiftlint --strict
      - name: Generate project
        run: xcodegen generate
      - name: Get iOS 27.1 simulator runtime (best effort)
        continue-on-error: true
        run: xcodebuild -downloadPlatform iOS -buildVersion 27.1 || xcodebuild -downloadPlatform iOS
      - name: Get Metal toolchain (SwiftTerm shaders)
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Pick simulator
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep -iE "duo|iphone" || true
          # Create an iPhone Duo device on the newest iOS runtime if the device type exists.
          rt=$(xcrun simctl list runtimes -j | python3 -c "import sys,json;r=[x for x in json.load(sys.stdin)['runtimes'] if x.get('isAvailable') and x['identifier'].split('.')[-1].startswith('iOS-')];r.sort(key=lambda x:[int(n) for n in x['version'].split('.')]);print(r[-1]['identifier'])")
          duo=$(xcrun simctl list devicetypes -j | python3 -c "import sys,json;d=[x['identifier'] for x in json.load(sys.stdin)['devicetypes'] if 'duo' in x['name'].lower()];print(d[0] if d else '')")
          if [ -n "$duo" ]; then xcrun simctl create "iPhone Duo CI" "$duo" "$rt" || true; fi
          xcrun simctl list devices available -j > devices.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          d = json.load(open("devices.json"))["devices"]
          best = None
          for rt, devs in d.items():
              m = re.search(r"iOS-(\d+)-(\d+)", rt)
              if not m:
                  continue
              ver = (int(m.group(1)), int(m.group(2)))
              for dev in devs:
                  name = dev["name"]
                  if "iPhone" not in name:
                      continue
                  score = (1 if "Duo" in name else 0, ver, name)
                  if best is None or score > best[0]:
                      best = (score, dev["udid"], name, ver)
          print(f"udid={best[1]}")
          print(f"name={best[2]}")
          print(f"os={best[3][0]}.{best[3][1]}")
          PY
      - name: Start testbed dashboard for the connection UI test (WP-22)
        run: |
          set -euo pipefail
          brew install uv
          ref=$(sed -n 's/^ARG HERMES_REF=//p' testbed/hermes/Dockerfile)
          src="$RUNNER_TEMP/hermes"
          git init -q "$src"
          git -C "$src" remote add origin https://github.com/NousResearch/hermes-agent
          git -C "$src" fetch -q --depth 1 origin "$ref"
          git -C "$src" checkout -q FETCH_HEAD
          (cd "$src" && (uv sync --frozen --no-dev || uv sync --frozen))
          export HERMES_HOME="$RUNNER_TEMP/hermes-home"
          FAKE_LLM_URL=http://127.0.0.1:8700/v1 sh testbed/hermes/seed-config.sh "$HERMES_HOME"
          # Same login as testbed/docker-compose.yml; binding 0.0.0.0 turns the auth gate on.
          HERMES_DASHBOARD_BASIC_AUTH_USERNAME=tester \
          HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=testbed-password \
          HERMES_DASHBOARD_BASIC_AUTH_SECRET=testbed-stable-secret-0123456789abcdef \
            nohup "$src/.venv/bin/hermes" serve --host 0.0.0.0 --port 9119 > "$RUNNER_TEMP/hermes-serve.log" 2>&1 &
          for _ in $(seq 1 90); do
            curl -fsS http://127.0.0.1:9119/api/status > /dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:9119/api/health
      - name: Test
        env:
          # xcodebuild passes TEST_RUNNER_* variables to the UI test runner without the prefix.
          TEST_RUNNER_HERMES_TESTBED_URL: http://127.0.0.1:9119
        run: |
          set -o pipefail
          echo "Simulator: ${{ steps.sim.outputs.name }} (iOS ${{ steps.sim.outputs.os }})"
          xcodebuild test \
            -skipPackagePluginValidation \
            -project simplyHermes.xcodeproj \
            -scheme simplyHermes \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/test.xcresult \
            -retry-tests-on-failure -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO | xcbeautify
      - name: Screenshot app on simulator
        if: always()
        run: |
          set -eo pipefail
          mkdir -p build/shots
          udid="${{ steps.sim.outputs.udid }}"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcodebuild build \
            -skipPackagePluginValidation \
            -project simplyHermes.xcodeproj \
            -scheme simplyHermes \
            -destination "id=$udid" \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO | xcbeautify
          app=$(find build/dd/Build/Products -name "*.app" -maxdepth 3 | head -1)
          xcrun simctl install "$udid" "$app"
          bundle=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Info.plist")
          xcrun simctl launch "$udid" "$bundle"
          sleep 5
          xcrun simctl io "$udid" screenshot build/shots/launch.png
          # WP-02: the posture debug view, as the Duo simulator (or the newest iPhone) reports it.
          xcrun simctl terminate "$udid" "$bundle" || true
          xcrun simctl launch "$udid" "$bundle" -HermesScreen postureDebug -HermesOnboarding skip
          sleep 4
          xcrun simctl io "$udid" screenshot build/shots/posture-debug.png
          # Live Activity (WP-63/64): run a long demo turn, then switch to Safari so the
          # Dynamic Island shows the activity. Best effort: older simulators have no island.
          xcrun simctl terminate "$udid" "$bundle" || true
          xcrun simctl launch "$udid" "$bundle" -HermesDemo liveActivity -HermesOnboarding skip || true
          sleep 6
          xcrun simctl io "$udid" screenshot build/shots/live-in-app.png || true
          xcrun simctl openurl "$udid" "https://example.com" || true
          sleep 5
          xcrun simctl io "$udid" screenshot build/shots/live-island.png || true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/shots
          if-no-files-found: warn
      - name: Build unsigned .ipa for sideloading
        run: |
          set -eo pipefail
          xcodebuild build \
            -skipPackagePluginValidation \
            -project simplyHermes.xcodeproj \
            -scheme simplyHermes \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/ddi \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | xcbeautify
          app=$(find build/ddi/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
          mkdir -p build/ipa/Payload
          cp -R "$app" build/ipa/Payload/
          (cd build/ipa && zip -qr simplyHermes-unsigned.ipa Payload && rm -rf Payload)
          ls -l build/ipa
      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: simplyHermes-unsigned-ipa
          path: build/ipa/simplyHermes-unsigned.ipa
      - name: Testbed dashboard log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/hermes-serve.log" || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: build/test.xcresult
