name: Probe SDK
on:
  push:
    branches: [claude/wp-02-posture]
jobs:
  probe:
    runs-on: xcode-27
    steps:
      - name: Dump reserved-region and SwiftUI hinge APIs
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1_Release_Candidate.app || true
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-path)
          echo "##### DEVICETYPES"; xcrun simctl list devicetypes | grep -i -E "duo|fold" || echo none
          echo "##### RUNTIMES"; xcrun simctl list runtimes
          echo "##### UIViewReservedRegion.h"; grep -v '^\s*$' "$sdk/System/Library/Frameworks/UIKit.framework/Headers/UIViewReservedRegion.h" | head -220
          echo "##### SWIFTUI"
          for f in $(find "$sdk/System/Library/Frameworks/SwiftUI.framework" -name '*arm64*.swiftinterface' -o -name '*.swiftinterface' | grep -v private | head -3); do
            echo "## $f"; grep -n -i -E "onHingeChange|HingeStatus|struct Hinge|ReservedRegion|reservedRegion|DivisionRegion|OcclusionRegion" "$f" | head -60
          done
