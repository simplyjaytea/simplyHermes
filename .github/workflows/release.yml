name: Alpha release

# Builds the unsigned simplyHermes .ipa that SideStore re-signs. Pushing a tag such as
# v0.1.0-alpha.1 publishes it as a GitHub prerelease. A manual run builds it as a workflow
# artifact and publishes only when publish is set. Install steps: docs/install-sidestore.md.
#
# App update feed: every run also writes version.json (the file the in-app "App update" banner reads) next to the
# .ipa, when the repo variable APP_UPDATE_INSTALL_URL is set. A manual run with update_feed set uploads it to the
# standing release app-update-feed, a full release kept as "latest", so
# releases/latest/download/version.json resolves. Run update_feed only after the build is signed on Signulous and
# the user has approved publishing it. Tag pushes never touch the feed.

on:
  push:
    tags: ["v*.*.*-alpha.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, such as 0.1.0-alpha.1. The number after alpha is the build number."
        required: true
        default: "0.1.0-alpha.1"
      publish:
        description: "Create tag v<version> at this commit and publish a prerelease"
        type: boolean
        default: false
      update_feed:
        description: "Publish version.json to the app-update-feed release (user-approved runs only, after Signulous signing)"
        type: boolean
        default: false
      notes:
        description: "App update notes. The first line shows on the banner."
        required: false
        default: ""

concurrency:
  group: alpha-release
  cancel-in-progress: false

jobs:
  alpha:
    name: Alpha IPA
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          pattern='^([0-9]+\.[0-9]+\.[0-9]+)-alpha\.([0-9]+)$'
          if [[ ! "$version" =~ $pattern ]]; then
            echo "::error::Version must look like 0.1.0-alpha.1, not $version"
            exit 1
          fi
          marketing="${BASH_REMATCH[1]}"
          build="${BASH_REMATCH[2]}"
          project=$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"$/\1/p' project.yml)
          if [ "$project" != "$marketing" ]; then
            echo "::error::project.yml sets MARKETING_VERSION $project, but $version needs $marketing"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Build number only goes up
        # The App update banner offers a build only when it is higher than the installed one. The build number is the
        # N in X.Y.Z-alpha.N, so N must stay above every earlier alpha tag, also across a new X.Y.Z. Publishing runs
        # fail on a lower or equal N; plain artifact builds only warn.
        env:
          BUILD: ${{ steps.version.outputs.build }}
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISHING: ${{ github.ref_type == 'tag' || inputs.publish || inputs.update_feed }}
        run: |
          set -euo pipefail
          highest=0
          while read -r tag; do
            [ "$tag" = "v$VERSION" ] && continue
            n="${tag##*-alpha.}"
            [[ "$n" =~ ^[0-9]+$ ]] && [ "$n" -gt "$highest" ] && highest="$n"
          done < <(git ls-remote --tags --refs origin 'v*-alpha.*' | sed 's#.*refs/tags/##')
          echo "Highest earlier alpha build: $highest. This build: $BUILD."
          if [ "$BUILD" -le "$highest" ]; then
            msg="Build $BUILD is not higher than earlier build $highest, so phones would never be offered it. Use alpha.$((highest + 1)) or higher."
            if [ "$PUBLISHING" = "true" ]; then
              echo "::error::$msg"
              exit 1
            fi
            echo "::warning::$msg"
          fi

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Generate project
        run: xcodegen generate

      - name: Get Metal toolchain (MLX and SwiftTerm shaders)
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Archive unsigned device build
        run: |
          set -o pipefail
          xcodebuild archive \
            -skipPackagePluginValidation \
            -project simplyHermes.xcodeproj \
            -scheme simplyHermes \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -archivePath build/simplyHermes.xcarchive \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | xcbeautify

      - name: Check the version stamp
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          plist=build/simplyHermes.xcarchive/Products/Applications/simplyHermes.app/Info.plist
          short=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$plist")
          bundle=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$plist")
          marketing="${VERSION%-alpha.*}"
          if [ "$short" != "$marketing" ] || [ "$bundle" != "$BUILD" ]; then
            echo "::error::Archive says $short ($bundle), but $VERSION needs $marketing ($BUILD)"
            exit 1
          fi
          echo "Archive version $short ($bundle) matches $VERSION"

      - name: Write version.json for the App update feed
        # Same build number as the stamped archive (read back from its Info.plist), and the install link from the repo
        # variable APP_UPDATE_INSTALL_URL. Without that variable no version.json is written, and update_feed fails.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          INSTALL_URL: ${{ vars.APP_UPDATE_INSTALL_URL }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          if [ -z "$INSTALL_URL" ]; then
            echo "::warning::APP_UPDATE_INSTALL_URL is not set, so no version.json was written."
            exit 0
          fi
          plist=build/simplyHermes.xcarchive/Products/Applications/simplyHermes.app/Info.plist
          bundle=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$plist")
          mkdir -p build/release
          python3 -I tools/ci/write_version_json.py \
            --version "$VERSION" --build "$bundle" --install-url "$INSTALL_URL" --notes "$NOTES" \
            --project project.yml --out build/release/version.json
          cat build/release/version.json

      - name: Package unsigned IPA
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          app=build/simplyHermes.xcarchive/Products/Applications/simplyHermes.app
          test -d "$app"
          mkdir -p build/release/Payload
          cp -R "$app" build/release/Payload/
          (cd build/release && zip -qr "simplyHermes-$VERSION.ipa" Payload && rm -rf Payload)
          (cd build/release && shasum -a 256 "simplyHermes-$VERSION.ipa" > "simplyHermes-$VERSION.ipa.sha256")
          ls -l build/release

      - name: Upload alpha files
        uses: actions/upload-artifact@v4
        with:
          name: simplyHermes-alpha-${{ steps.version.outputs.version }}
          path: build/release
          if-no-files-found: error

      - name: Publish prerelease
        if: github.ref_type == 'tag' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          notes=build/release-notes.md
          {
            echo "Early alpha for SideStore installs. Apple has not signed this build."
            echo
            echo "Install: https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/install-sidestore.md"
            echo "Known issues: https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/alpha-known-issues.md"
          } > "$notes"
          gh release create "v$VERSION" \
            "build/release/simplyHermes-$VERSION.ipa" "build/release/simplyHermes-$VERSION.ipa.sha256" \
            --target "$GITHUB_SHA" --prerelease --title "simplyHermes $VERSION" --notes-file "$notes"

      - name: Publish the App update feed
        # User-approved manual runs only. Uploads version.json to the standing full release app-update-feed, and keeps
        # it "latest" so releases/latest/download/version.json points at it. App builds stay prereleases, which never
        # become "latest".
        if: github.event_name == 'workflow_dispatch' && inputs.update_feed
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          if [ ! -f build/release/version.json ]; then
            echo "::error::No version.json (APP_UPDATE_INSTALL_URL is not set), so the feed was not published."
            exit 1
          fi
          # The feed must only go up: refuse a build that is not higher than the one already published.
          if gh release download app-update-feed --pattern version.json --dir build/current-feed 2>/dev/null; then
            current=$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["build"])' build/current-feed/version.json)
            if [ "$BUILD" -le "$current" ]; then
              echo "::error::The feed already offers build $current; build $BUILD is not higher."
              exit 1
            fi
          else
            gh release create app-update-feed --target "$GITHUB_SHA" --title "App update feed" --latest \
              --notes "Holds version.json for the in-app App update banner. App builds are the prereleases."
          fi
          gh release upload app-update-feed build/release/version.json --clobber
          gh release edit app-update-feed --latest
